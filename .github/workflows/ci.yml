name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
        env:
          WHITE_CLIFF_USER_AGENT: "Ci Runner ci@example.com"

  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check authorship
        env:
          AUTHOR_NAME: ${{ vars.AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.AUTHOR_EMAIL }}
        run: |
          if [ -z "$AUTHOR_NAME" ]; then
            echo "repository variable AUTHOR_NAME is missing"
            exit 1
          fi
          if [ -z "$AUTHOR_EMAIL" ]; then
            echo "repository variable AUTHOR_EMAIL is missing"
            exit 1
          fi
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main
            BASE="origin/main"
          fi
          python3 scripts/check_authorship.py --range "$BASE..HEAD"
