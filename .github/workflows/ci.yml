name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
        env:
          WHITE_CLIFF_USER_AGENT: "Ci Runner ci@example.com"

  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check authorship
        run: python3 scripts/check_authorship.py --range 6397b468a59a725d727a9b7abf5b3756655fa76f..HEAD

  # macos-14 was removed from GitHub Actions on 2026-11-02.
  # Apple silicon builds run on macos-15. Intel builds run on macos-15-intel.
  package-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the open guides
        run: python3 scripts/render_guides.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: how-to-open-guides
          path: |
            how-to-open-en.png
            how-to-open-de.png
          retention-days: 7
          if-no-files-found: error
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "White Cliff" \
            --collect-submodules white_cliff --collect-data white_cliff --collect-data certifi \
            scripts/desktop_entry.py
          stage="WhiteCliff-Mac-Apple-silicon"
          mkdir -p "$stage"
          cp -R "dist/White Cliff.app" "$stage/"
          cp docs/how-to-open.md "$stage/how-to-open.md"
          cp docs/how-to-open-de.md "$stage/how-to-open-de.md"
          cp docs/how-to-*.png "$stage/"
          ditto -c -k --keepParent "$stage" "$stage.zip"
          shasum -a 256 "$stage.zip" > SHA256SUMS
      - name: Show the old certificate failure
        run: |
          saved_file="${SSL_CERT_FILE-}"
          saved_dir="${SSL_CERT_DIR-}"
          unset SSL_CERT_FILE
          unset SSL_CERT_DIR
          unset REQUESTS_CA_BUNDLE
          unset CURL_CA_BUNDLE
          python3 -c 'import ssl; print(ssl.get_default_verify_paths())'
          python3 scripts/prove_old_tls.py "$saved_file" "$saved_dir"
      - name: Smoke
        timeout-minutes: 12
        run: |
          unset SSL_CERT_FILE
          unset SSL_CERT_DIR
          unset REQUESTS_CA_BUNDLE
          unset CURL_CA_BUNDLE
          python3 scripts/smoke_mac.py "dist/White Cliff.app/Contents/MacOS/White Cliff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-arm64
          path: smoke-*.png
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteCliff-Mac-Apple-silicon
          path: |
            WhiteCliff-Mac-Apple-silicon.zip
            SHA256SUMS
          retention-days: 7

  package-intel-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "White Cliff" \
            --collect-submodules white_cliff --collect-data white_cliff --collect-data certifi \
            scripts/desktop_entry.py
          stage="WhiteCliff-Mac-Intel"
          mkdir -p "$stage"
          cp -R "dist/White Cliff.app" "$stage/"
          cp docs/how-to-open.md "$stage/how-to-open.md"
          cp docs/how-to-open-de.md "$stage/how-to-open-de.md"
          cp docs/how-to-*.png "$stage/"
          ditto -c -k --keepParent "$stage" "$stage.zip"
          shasum -a 256 "$stage.zip" > SHA256SUMS
      - name: Show the old certificate failure
        run: |
          saved_file="${SSL_CERT_FILE-}"
          saved_dir="${SSL_CERT_DIR-}"
          unset SSL_CERT_FILE
          unset SSL_CERT_DIR
          unset REQUESTS_CA_BUNDLE
          unset CURL_CA_BUNDLE
          python3 -c 'import ssl; print(ssl.get_default_verify_paths())'
          python3 scripts/prove_old_tls.py "$saved_file" "$saved_dir"
      - name: Smoke
        timeout-minutes: 12
        run: |
          unset SSL_CERT_FILE
          unset SSL_CERT_DIR
          unset REQUESTS_CA_BUNDLE
          unset CURL_CA_BUNDLE
          python3 scripts/smoke_mac.py "dist/White Cliff.app/Contents/MacOS/White Cliff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-x86_64
          path: smoke-*.png
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteCliff-Mac-Intel
          path: |
            WhiteCliff-Mac-Intel.zip
            SHA256SUMS
          retention-days: 7

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "White Cliff" --collect-submodules white_cliff --collect-data white_cliff --collect-data certifi scripts/desktop_entry.py
          $stage = "WhiteCliff-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/White Cliff.exe" (Join-Path $stage "White Cliff.exe")
          Copy-Item "docs/how-to-open.md" (Join-Path $stage "how-to-open.md")
          Copy-Item "docs/how-to-open-de.md" (Join-Path $stage "how-to-open-de.md")
          Copy-Item "docs/how-to-*.png" $stage
          Compress-Archive -Path $stage -DestinationPath "WhiteCliff-Windows.zip"
          $hash = (Get-FileHash "WhiteCliff-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "SHA256SUMS" -Value "$hash  WhiteCliff-Windows.zip" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteCliff-Windows
          path: |
            WhiteCliff-Windows.zip
            SHA256SUMS
          retention-days: 7
