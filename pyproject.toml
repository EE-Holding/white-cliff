[project]
name = "white-cliff"
version = "0.1.0"
description = "Explain the numbers in a public company filing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Erik Eicke" }]
dependencies = ["certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
white-cliff = "white_cliff.cli:main"
white-cliff-desktop = "white_cliff.desktop_main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
white_cliff = ["data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
