[project]
name = "white-cliff"
version = "1.0.0"
description = "Explain the numbers in a public company filing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Erik Eicke" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
white-cliff = "white_cliff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
white_cliff = ["data/confusables.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
